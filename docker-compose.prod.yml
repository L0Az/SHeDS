version: '3.7'

volumes:
  pg_data: {}
  passbolt_db_data: {}
  passbolt_gpg: {}
  passbolt_images: {}

services:
  db:
    image: postgres:16.2
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-56000}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: always
    command: gunicorn --bind 0.0.0.0:9000 --workers 3 config.wsgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./oci_api_key.pem:/app/oci_api_key.pem:ro
    ports:
      - "9000:9000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CACHE_LOCATION=redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.production

  redis:
    image: redis:7.0-alpine
    restart: always

  passbolt_db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: ${PASSBOLT_DB_NAME:-passbolt}
      MYSQL_USER: ${PASSBOLT_DB_USER:-passbolt}
      MYSQL_PASSWORD: ${PASSBOLT_DB_PASSWORD}
    volumes:
      - passbolt_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  passbolt:
    image: passbolt/passbolt:latest-ce
    restart: always
    depends_on:
      passbolt_db:
        condition: service_healthy
    environment:
      APP_FULL_BASE_URL: ${PASSBOLT_BASE_URL}
      DATASOURCES_DEFAULT_HOST: passbolt_db
      DATASOURCES_DEFAULT_USERNAME: ${PASSBOLT_DB_USER:-passbolt}
      DATASOURCES_DEFAULT_PASSWORD: ${PASSBOLT_DB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: ${PASSBOLT_DB_NAME:-passbolt}
      EMAIL_DEFAULT_FROM: ${PASSBOLT_EMAIL_FROM}
      EMAIL_TRANSPORT_DEFAULT_HOST: ${PASSBOLT_SMTP_HOST}
      EMAIL_TRANSPORT_DEFAULT_PORT: ${PASSBOLT_SMTP_PORT:-587}
      EMAIL_TRANSPORT_DEFAULT_USERNAME: ${PASSBOLT_SMTP_USER}
      EMAIL_TRANSPORT_DEFAULT_PASSWORD: ${PASSBOLT_SMTP_PASSWORD}
      EMAIL_TRANSPORT_DEFAULT_TLS: "true"
    ports:
      - "${PASSBOLT_HTTP_PORT:-8080}:80"
      - "${PASSBOLT_HTTPS_PORT:-8443}:443"
    volumes:
      - passbolt_gpg:/etc/passbolt/gpg
      - passbolt_images:/usr/share/php/passbolt/webroot/img/public
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/auth/verify.json | grep -q 'success' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  passbolt_init:
    image: passbolt/passbolt:latest-ce
    restart: on-failure
    depends_on:
      passbolt:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/passbolt_init.sh"]
    environment:
      APP_FULL_BASE_URL: ${PASSBOLT_BASE_URL}
      DATASOURCES_DEFAULT_HOST: passbolt_db
      DATASOURCES_DEFAULT_USERNAME: ${PASSBOLT_DB_USER:-passbolt}
      DATASOURCES_DEFAULT_PASSWORD: ${PASSBOLT_DB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: ${PASSBOLT_DB_NAME:-passbolt}
      EMAIL_DEFAULT_FROM: ${PASSBOLT_EMAIL_FROM}
      EMAIL_TRANSPORT_DEFAULT_HOST: ${PASSBOLT_SMTP_HOST}
      EMAIL_TRANSPORT_DEFAULT_PORT: ${PASSBOLT_SMTP_PORT:-587}
      EMAIL_TRANSPORT_DEFAULT_USERNAME: ${PASSBOLT_SMTP_USER}
      EMAIL_TRANSPORT_DEFAULT_PASSWORD: ${PASSBOLT_SMTP_PASSWORD}
      PASSBOLT_ADMIN_EMAIL: ${PASSBOLT_ADMIN_EMAIL}
      PASSBOLT_ADMIN_FIRST_NAME: ${PASSBOLT_ADMIN_FIRST_NAME:-Admin}
      PASSBOLT_ADMIN_LAST_NAME: ${PASSBOLT_ADMIN_LAST_NAME:-User}
      PASSBOLT_GPG_PUBLIC_KEY: ${PASSBOLT_GPG_PUBLIC_KEY}
    volumes:
      - ./scripts/passbolt_init.sh:/passbolt_init.sh:ro
